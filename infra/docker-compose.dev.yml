# Local development backing services · apps (web · api · realtime) run on the host with `npm run dev:*`
# LAN test: NODE_IP=<this machine's IP> npm run infra:up (LiveKit must announce an IP other devices can reach)
name: connecta-dev
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: connecta
      POSTGRES_PASSWORD: connecta
      POSTGRES_DB: connecta
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecta"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  storage: # S3-compatible object store (MinIO no longer ships Docker images) · S3 API on :8333
    image: chrislusf/seaweedfs:4.51
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - storagedata:/data
      - ./seaweedfs/s3.dev.json:/etc/seaweedfs/s3.json:ro
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: --dev --bind 0.0.0.0 --node-ip ${NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
  mailpit: # catches every email in dev · inbox at http://localhost:8025
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  storagedata:

# Production on the VM · only nginx (80) and LiveKit media are reachable from outside
# Usage: cp infra/.env.prod.example infra/.env.prod && edit · docker compose -f infra/docker-compose.yml --env-file infra/.env.prod up -d --build
name: connecta
x-app: &app
  restart: unless-stopped
  env_file: .env.prod
  environment:
    DATABASE_URL: postgresql://connecta:${POSTGRES_PASSWORD}@postgres:5432/connecta
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://storage:8333
    API_INTERNAL_URL: http://api:4000
    WEB_INTERNAL_URL: http://web:3000
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment: { POSTGRES_USER: connecta, POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}', POSTGRES_DB: connecta }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U connecta'], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  storage:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes: [storagedata:/data, ./seaweedfs/s3.prod.json:/etc/seaweedfs/s3.json:ro]
  migrate:
    <<: *app
    restart: 'no'
    build: { context: .., target: migrate }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    <<: *app
    build: { context: .., target: api }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started }, storage: { condition: service_started } }
  realtime:
    <<: *app
    build: { context: .., target: realtime }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started } }
  web:
    <<: *app
    build:
      context: ..
      target: web
      args: { BASE_PATH: '${BASE_PATH}', PUBLIC_REALTIME_URL: '${PUBLIC_REALTIME_URL}' }
    depends_on: { migrate: { condition: service_completed_successfully } }
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['${HTTP_PORT:-80}:80']
    environment: { BASE_PATH: '${BASE_PATH}' }
    volumes: [./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro]
    depends_on: [web, api, realtime]
  # Self-hosted media needs a public IP + UDP 50000-60000 (or TURN on 443) · without them use LiveKit Cloud:
  # set LIVEKIT_URL / PUBLIC_LIVEKIT_URL / keys in .env.prod and start without this profile
  livekit:
    profiles: [selfhost-media]
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment: { LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}' }
    volumes: [./livekit/livekit.yaml:/etc/livekit.yaml:ro]
volumes:
  pgdata:
  storagedata:
